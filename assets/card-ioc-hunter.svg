<text x="572" y="42" text-anchor="end" font-size="18" fill="#6e7681">↗</text>
<text x="28" y="84" font-size="30" font-weight="800" fill="#c9d1d9">ioc-hunter</text>
<text x="28" y="114" font-size="13.5" fill="#6e7681">Extracts &amp; defangs IOCs from threat reports.</text>
<text x="28" y="134" font-size="13.5" fill="#6e7681">Client-side; its CSP blocks all exfiltration.</text>
