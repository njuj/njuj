<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" xml:space="preserve" style="white-space:pre"><defs>
<clipPath id="frame"><rect width="600" height="190" rx="14"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffd166" stroke-opacity=".05"/></pattern>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>.shine{animation:shine 7s ease-in-out infinite}@keyframes shine{0%,60%{transform:translateX(-260px) skewX(-20deg)}100%{transform:translateX(860px) skewX(-20deg)}}
.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{fill-opacity:.2}}</style>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="190" fill="#0b0f17"/>
